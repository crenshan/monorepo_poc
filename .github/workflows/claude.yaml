name: Claude Code

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          claude_args: '--allowedTools "Bash(gh pr comment:*),Read,Grep,Glob"'
          prompt: |
            Review this PR for compliance with the repo's documented rules.

            For each changed file, read the nearest AGENTS.md ...

            Then post your findings as a PR comment using:
            gh pr comment ${{ github.event.pull_request.number }} --body "..."

            If there are no violations, post a comment saying so.
